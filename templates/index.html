<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lector Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>

<body>

    <!-- =====================================================
         INICIO
         ===================================================== -->

    <main id="home-view">

        <header class="main-header">
            <h1>VECTOR</h1>
        </header>


        <!-- =================================================
             NIVEL 1
             ================================================= -->

        <section id="main-actions">

            <button
                id="btn-continue"
                class="main-action"
                type="button"
            >
                <span class="action-title">CONTINUAR</span>
                <span
                    id="continue-file"
                    class="action-subtitle"
                >
                    No hay un archivo reciente
                </span>
            </button>


            <button
                id="btn-create"
                class="main-action"
                type="button"
            >
                <span class="action-title">CREAR</span>
                <span class="action-subtitle">
                    Crear un nuevo .imgmap
                </span>
            </button>

        </section>


        <!-- =================================================
             NIVEL 2 - BIBLIOTECA
             ================================================= -->

        <section id="library-section">

            <div class="section-header">

                <div>
                    <h2>BIBLIOTECA</h2>

                    <span
                        id="library-location"
                        class="library-location"
                    >
                        Biblioteca no seleccionada
                    </span>
                </div>


                <button
                    id="btn-library-folder"
                    class="secondary-button"
                    type="button"
                >
                    ELEGIR CARPETA
                </button>

            </div>


            <div
                id="library-list"
                class="library-list"
            >

                <div
                    id="library-empty"
                    class="library-empty"
                >
                    <p>No hay una biblioteca seleccionada.</p>

                    <p>
                        Elegí una carpeta para mostrar tus
                        archivos .imgmap.
                    </p>
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         ÍNDICE DEL MAPA
         ===================================================== -->

    <main
        id="root-view"
        class="view hidden"
    >

        <header class="map-header">

            <div class="map-header-text">
                <h1 id="root-title"></h1>
            </div>

        </header>


        <section
            id="cards"
            class="branch-grid"
        ></section>

    </main>


    <!-- =====================================================
         VISOR DE RAMA
         ===================================================== -->

    <main
        id="branch-view"
        class="view hidden"
    >

        <header id="branch-topbar">

            <div class="branch-header-left">

                <span
                    id="branch-title"
                    class="branch-title"
                ></span>

            </div>


            <div
                id="zoom-controls"
                class="zoom-controls"
            >

                <button
                    id="zoom-out"
                    class="zoom-button"
                    type="button"
                    aria-label="Alejar"
                >
                    −
                </button>


                <input
                    id="zoom-input"
                    type="number"
                    min="10"
                    max="150"
                    step="5"
                    value="40"
                    aria-label="Zoom"
                >


                <span class="zoom-symbol">%</span>


                <button
                    id="zoom-in"
                    class="zoom-button"
                    type="button"
                    aria-label="Acercar"
                >
                    +
                </button>

            </div>

        </header>


        <section
            id="strip"
            class="image-strip"
        ></section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="/app.js"></script>

</body>
</html>
